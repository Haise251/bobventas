name: bob_ventas
description: POS Bob Burguer — Ventas, tickets e impresión térmica (Windows + Android).
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Base de datos ---
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+3
  path: ^1.8.3

  # --- Impresión PDF (Windows: vía driver del sistema) ---
  pdf: ^3.10.7
  printing: ^5.12.0

  # --- Impresión térmica ESC/POS (Android USB OTG 58mm) ---
  esc_pos_utils_plus: ^2.0.3
  flutter_thermal_printer: ^2.3.0

  # --- Decodificar logo PNG para rasterizarlo en ESC/POS ---
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - img/
