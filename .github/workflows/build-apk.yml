# =========================================================================
# Bob Ventas - Compilación automática del APK en la nube (GitHub Actions)
# Se ejecuta en cada push a main (o manualmente desde la pestaña Actions).
# El APK queda como "Artifact" descargable al finalizar la compilación.
# =========================================================================
name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter (versión fijada para que el NDK coincida)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Generar esqueleto Android (gradlew y archivos faltantes)
        run: flutter create --project-name bob_ventas --platforms android --org com.bobburgers .

      - name: Ajustar memoria de Gradle para el runner de CI
        run: sed -i.bak 's/-Xmx8G/-Xmx4G/' android/gradle.properties

      - name: Pre-instalar NDK r28c (evita descarga frágil dentro de Gradle)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: bob-ventas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
